<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Newzealand</title>
    <link href="../style.css" rel="stylesheet">
    <script src="../handlebars.min.js"></script>
    <script id="template" type="text/x-handlebars-template">
      {{#each nz}}
        <article class="nz">
            <img class="image" src={{this.image}}  alt={{this.name}}>
            <section class="details">
              <h3 class="name">{{this.name}}</h3>
              <p class="description">{{this.description}}</p>
            </section>
          </article>
        {{/each}}
    </script>
  </head>

  <body id="nz-bg">
    <header>
      <section class="container">
        <h2 class="branding">Family</h2>

        <nav>
        <ul class="navbar">
            <li>
              <a href="../index.html">Home</a>
            </li>
            <li>
              <a href="vietnam.html">Vietnam</a>
            </li>
            <li>
              <a href="hongkong.html">Hong Kong</a>
            </li>
            <li>
              <a href="canada.html">Canada</a>
            </li>
            <li class="current">
              <a href="nz.html">New Zealand</a>
            </li>
          </ul>
        </nav>
      </section>
    </header>

    <article id="showcase">
        <h1 class="container">New Zealand</h1>
        <p class="container">Yên bình và tìm được hạnh phúc nơi vùng đất của những dải mây trắng dài</p>
      <section class="container" id="information">

      </section>
    </article>

    <footer>
      <p>&copy; Family</p>
    </footer>

    <script src="../main.js" type="text/javascript"></script>
  </body>
</html>
